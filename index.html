    <!--
      Resolve the theme before the first paint. This is render-blocking on
      purpose: it is a few microseconds of work, and without it a visitor who
      chose light mode gets a full frame of dark background first.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored !== 'light' && stored !== 'dark') stored = 'system';
          document.documentElement.dataset.theme =
            stored === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
